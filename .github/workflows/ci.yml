name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1 pinned 2026-07-28.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0 pinned 2026-07-28.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # actions/setup-node v7.0.0 pinned 2026-07-28.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[wecom]"

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Check dashboard JavaScript syntax
        run: node --check src/xau_monitor/web_static/dashboard.js
