name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4 pinned 2026-07-28.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-python v5 pinned 2026-07-28.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      # actions/setup-node v4 pinned 2026-07-28.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[wecom]"

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Check dashboard JavaScript syntax
        run: node --check src/xau_monitor/web_static/dashboard.js
