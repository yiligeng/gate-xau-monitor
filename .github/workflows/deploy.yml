name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on:
      - self-hosted
      - xau-monitor
      - production
    env:
      # Avoid probing restricted sbin paths during GitHub action cleanup.
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1 pinned 2026-07-28.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify and test in runner workspace
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          bash -n ops/update-xau-tzdata
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -e ".[wecom]"
          .ci-venv/bin/python -m unittest discover -s tests
          if command -v node >/dev/null 2>&1; then
            node --check src/xau_monitor/web_static/dashboard.js
            node --check src/xau_monitor/web_static/hypotheses.js
            node --check src/xau_monitor/web_static/auth.js
            node --check src/xau_monitor/web_static/account.js
          fi

      - name: Keep production time zone rules current
        run: |
          sudo install -o root -g root -m 0755 ops/update-xau-tzdata /usr/local/sbin/update-xau-tzdata
          sudo install -o root -g root -m 0644 ops/xau-tzdata-update.service /etc/systemd/system/xau-tzdata-update.service
          sudo install -o root -g root -m 0644 ops/xau-tzdata-update.timer /etc/systemd/system/xau-tzdata-update.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now xau-tzdata-update.timer
          sudo /usr/local/sbin/update-xau-tzdata

      - name: Deploy with fixed server script
        run: sudo /usr/local/sbin/deploy-xau-monitor "$GITHUB_WORKSPACE" "$GITHUB_SHA"
