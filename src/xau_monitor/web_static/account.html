<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#080a0b">
    <title>账户设置 · 行情监控</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/auth.css?v=1">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card wide" aria-labelledby="account-title">
        <div class="auth-mark" aria-hidden="true">ID</div>
        <p class="eyebrow">ACCOUNT SECURITY</p>
        <h1 id="account-title">修改账户凭据</h1>
        <p class="intro">
          当前用户：<span id="current-user" class="current-user">读取中…</span>。
          修改时必须输入当前密码，成功后其他设备上的会话会全部失效。
        </p>
        <form id="account-form">
          <label for="current-password">当前密码</label>
          <input
            id="current-password"
            name="current_password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="current-password"
            required
          >
          <label for="new-username">新用户名（留空则不修改）</label>
          <input
            id="new-username"
            name="new_username"
            type="text"
            minlength="1"
            maxlength="32"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
          >
          <label for="new-password">新密码（留空则不修改，至少 12 位）</label>
          <input
            id="new-password"
            name="new_password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
          >
          <label for="confirm-password">确认新密码</label>
          <input
            id="confirm-password"
            name="confirm_password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
          >
          <button id="save-button" type="submit">保存修改</button>
          <p id="account-message" class="form-message" role="status"></p>
        </form>
        <div class="account-actions">
          <a class="button-link secondary" href="/">返回仪表盘</a>
          <button id="logout-button" class="danger" type="button">退出登录</button>
        </div>
      </section>
    </main>
    <script src="/account.js?v=1"></script>
  </body>
</html>
