<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#080a0b">
    <title>登录 · 行情监控</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/auth.css?v=1">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-mark" aria-hidden="true">Au</div>
        <p class="eyebrow">PRIVATE MARKET MONITOR</p>
        <h1 id="login-title">登录行情监控</h1>
        <p class="intro">仪表盘和行情接口仅向已授权用户开放。</p>
        <form id="login-form">
          <label for="username">用户名</label>
          <input
            id="username"
            name="username"
            type="text"
            minlength="1"
            maxlength="32"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
            autofocus
          >
          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="current-password"
            required
          >
          <button id="login-button" type="submit">登录</button>
          <p id="login-error" class="form-message error" role="alert"></p>
        </form>
        <p class="security-note">登录凭据由管理员提供。请勿与未授权人员共享。</p>
      </section>
    </main>
    <script src="/auth.js?v=1"></script>
  </body>
</html>
